name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: '3.3'
          - os: macos-latest
            ruby: '3.3'
          # Windows builds with MSVC (see the windows-toolchain / MRUBY_CONFIG
          # steps below). The Ruby flavor only runs rake + the test fixture, so a
          # plain ucrt build is fine — we install no MinGW toolchain with it.
          - os: windows-latest
            ruby: '3.3'
    steps:
      - uses: actions/checkout@v4
        with:
          # deps/curl is a submodule (the vendored libcurl source used for the
          # Windows build). mruby itself is NOT vendored — `rake` clones HEAD.
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # Windows: do NOT install the MSYS2/MinGW devkit. That gcc toolchain
          # both leaks its headers into INCLUDE (which breaks the MSVC libcurl
          # build) and tempts mruby into the gcc toolchain. We build with MSVC.
          # (Ignored on Linux/macOS.)
          windows-toolchain: none

      # test/server.ruby (the HTTP/SMTP/IMAP fixture) needs webrick, which is no
      # longer a default gem on Ruby 3.x. rake is a default gem already.
      - name: Install test-server gem
        run: gem install webrick

      - name: Linux build deps (system libcurl via pkg-config)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config

      - name: macOS build deps (Homebrew libcurl via pkg-config)
        if: runner.os == 'macOS'
        run: |
          brew install curl pkg-config
          # curl is keg-only on macOS (the OS ships its own), so point pkg-config
          # at the Homebrew one for `spec.search_package 'libcurl'`.
          echo "PKG_CONFIG_PATH=$(brew --prefix curl)/lib/pkgconfig" >> "$GITHUB_ENV"

      # Windows: set up the MSVC (Visual Studio) developer environment — cl, the
      # SDK INCLUDE/LIB, VSINSTALLDIR — so the libcurl CMake build and the gem
      # compile with MSVC. With windows-toolchain: none above, there is no MSYS2
      # in the environment to collide with it.
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Force the MSVC toolchain explicitly via the dedicated build config, rather
      # than relying on mruby's env auto-detection (which falls back to gcc when no
      # VS environment is detected).
      - name: Windows — use the MSVC build config
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "MRUBY_CONFIG=build_config_visualcpp.rb" >> $env:GITHUB_ENV

      - name: rake test
        run: rake test
