name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Merging a PR pushes a merge commit whose tree the PR run just tested, so the
# push-triggered duplicate is skipped by matching the merge-commit message.
# Direct pushes to main (and everything else) run normally. Note: relies on
# merge commits ("Merge pull request #N..."); if the repo ever switches to
# squash merges, this guard stops matching and the duplicate run returns.
jobs:
  # Fail fast if a tool-generated session URL sneaks into the tree or into a
  # commit message — those identifiers must never be published (see
  # docs/history-rewrite.md). The tree grep excludes this workflow (it must
  # name the patterns) and the rewrite doc (it documents the rewrite).
  hygiene:
    name: no session URLs
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Reject session URLs in files and recent commit messages
        run: |
          set -e
          pattern='claude\.ai/code|session_01|Claude-Session:'
          if git grep -nE "$pattern" -- . ':!.github/workflows/ci.yml' ':!docs/history-rewrite.md'; then
            echo '::error::session URL found in the tree'; exit 1
          fi
          if git log -50 --format=%B | grep -nE "$pattern"; then
            echo '::error::session URL found in a commit message'; exit 1
          fi

  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ${{ matrix.os }}
    # The full matrix normally finishes in under 5 minutes; this is a safety
    # net against a genuine hang running to GitHub's default 6-hour cap.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: '3.3'
          - os: macos-latest
            ruby: '3.3'
          # Windows builds with MSVC (see the windows-toolchain / MRUBY_CONFIG
          # steps below). The Ruby flavor only runs rake + the test fixture, so a
          # plain ucrt build is fine — we install no MinGW toolchain with it.
          - os: windows-latest
            ruby: '3.3'
    steps:
      - uses: actions/checkout@v4
        with:
          # deps/curl is a submodule (the vendored libcurl source used for the
          # Windows build). mruby itself is NOT vendored — `rake` clones HEAD.
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # Windows: do NOT install the MSYS2/MinGW devkit. That gcc toolchain
          # both leaks its headers into INCLUDE (which breaks the MSVC libcurl
          # build) and tempts mruby into the gcc toolchain. We build with MSVC.
          # (Ignored on Linux/macOS.)
          windows-toolchain: none

      # test/server.ruby (the HTTP/SMTP/IMAP fixture) needs webrick, which is no
      # longer a default gem on Ruby 3.x. rake is a default gem already.
      - name: Install test-server gem
        run: gem install webrick

      - name: Linux build deps (system libcurl via pkg-config)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config

      - name: macOS build deps (Homebrew libcurl via pkg-config)
        if: runner.os == 'macOS'
        run: |
          # A stale Homebrew install reproducibly caused multi-minute stalls
          # in this gem's own transfers on a local machine; `brew upgrade`
          # fixed it there. Update first so CI never builds against the same
          # stale packages.
          brew update
          brew upgrade
          brew install curl pkg-config
          # curl is keg-only on macOS (the OS ships its own), so point pkg-config
          # at the Homebrew one for `spec.search_package 'libcurl'`.
          echo "PKG_CONFIG_PATH=$(brew --prefix curl)/lib/pkgconfig" >> "$GITHUB_ENV"

      # Windows: set up the MSVC (Visual Studio) developer environment — cl, the
      # SDK INCLUDE/LIB, VSINSTALLDIR — so the libcurl CMake build and the gem
      # compile with MSVC. With windows-toolchain: none above, there is no MSYS2
      # in the environment to collide with it.
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Cache the vendored libcurl build. The install prefix is all the gem
      # consumes (headers + static lib), so it lives outside mruby's build dir
      # (which `rake` recreates) and is keyed on the exact deps/curl submodule
      # commit — a curl bump busts the cache, nothing else does. mrbgem.rake
      # skips the whole CMake build when the prefix is already populated.
      - name: Windows — vendored libcurl cache key
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD:deps/curl
          echo "CURL_SUBMODULE_SHA=$sha" >> $env:GITHUB_ENV
          echo "MURL_CURL_INSTALL=$env:GITHUB_WORKSPACE\curl-prebuilt" >> $env:GITHUB_ENV
      - name: Windows — cache vendored libcurl
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: curl-prebuilt
          key: libcurl-msvc-${{ env.CURL_SUBMODULE_SHA }}-v1

      # Force the MSVC toolchain explicitly via the dedicated build config, rather
      # than relying on mruby's env auto-detection (which falls back to gcc when no
      # VS environment is detected).
      - name: Windows — use the MSVC build config
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "MRUBY_CONFIG=build_config_visualcpp.rb" >> $env:GITHUB_ENV

      - name: rake test
        if: runner.os != 'macOS'
        run: rake test

      # mrbtest normally finishes in ~4 seconds; macOS CI has intermittently
      # stalled inside it for an unknown reason (unrelated to the stale-brew
      # issue above — reproduces even right after brew update/upgrade). Watch
      # for the mrbtest process specifically and, if it runs far past its
      # normal time, capture a thread-by-thread stack sample before killing
      # it, so the log shows what it's blocked on instead of just "job timed
      # out".
      - name: rake test (macOS, with mrbtest hang watchdog)
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          rake test &
          rake_pid=$!

          mrbtest_pid=""
          stuck_for=0
          while kill -0 "$rake_pid" 2>/dev/null; do
            sleep 1
            if [ -n "$mrbtest_pid" ] && ! kill -0 "$mrbtest_pid" 2>/dev/null; then
              mrbtest_pid=""
            fi
            if [ -z "$mrbtest_pid" ]; then
              mrbtest_pid=$(pgrep -n -x mrbtest || true)
              stuck_for=0
              continue
            fi
            stuck_for=$((stuck_for + 1))
            # Backstop: healthy mrbtest finishes in ~5s on these runners; a
            # transfer wedged past DEFAULT_TIMEOUT parks for 30s. Sample well
            # before that so the log shows the stack of a genuine hang.
            if [ "$stuck_for" -ge 25 ]; then
              echo "::warning::mrbtest (pid $mrbtest_pid) has been running ${stuck_for}s — normally ~4s. Capturing a stack sample."
              sample "$mrbtest_pid" 5 -file /tmp/mrbtest_sample.txt || true
              echo "----- sample: mrbtest (pid $mrbtest_pid) -----"
              cat /tmp/mrbtest_sample.txt 2>/dev/null || echo "(sample failed to produce output)"
              echo "----- fixture state dir -----"
              ls -la mruby/build/url-test-run 2>/dev/null || echo "(no state dir)"
              echo "----- fixture server.log -----"
              cat mruby/build/url-test-run/server.log 2>/dev/null || echo "(no server.log)"
              echo "----- fixture processes -----"
              ps ax -o pid,ppid,stat,command | grep -E 'server\.ruby|sshd|slapd|mosquitto' | grep -v grep || echo "(none)"
              echo "-----------------------------------------------"
              kill -9 "$mrbtest_pid" 2>/dev/null || true
              kill -9 "$rake_pid" 2>/dev/null || true
              break
            fi
          done

          wait "$rake_pid"
