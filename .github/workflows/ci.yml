name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail fast if a tool-generated session URL sneaks into the tree or into a
  # commit message — those identifiers must never be published (see the
  # history-rewrite note in the README). The tree grep excludes this workflow
  # (it must name the patterns) and the README (it documents the rewrite).
  hygiene:
    name: no session URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Reject session URLs in files and recent commit messages
        run: |
          set -e
          pattern='claude\.ai/code|session_01|Claude-Session:'
          if git grep -nE "$pattern" -- . ':!.github/workflows/ci.yml' ':!README.md'; then
            echo '::error::session URL found in the tree'; exit 1
          fi
          if git log -50 --format=%B | grep -nE "$pattern"; then
            echo '::error::session URL found in a commit message'; exit 1
          fi

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: '3.3'
          - os: macos-latest
            ruby: '3.3'
          # Windows builds with MSVC (see the windows-toolchain / MRUBY_CONFIG
          # steps below). The Ruby flavor only runs rake + the test fixture, so a
          # plain ucrt build is fine — we install no MinGW toolchain with it.
          - os: windows-latest
            ruby: '3.3'
    steps:
      - uses: actions/checkout@v4
        with:
          # deps/curl is a submodule (the vendored libcurl source used for the
          # Windows build). mruby itself is NOT vendored — `rake` clones HEAD.
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # Windows: do NOT install the MSYS2/MinGW devkit. That gcc toolchain
          # both leaks its headers into INCLUDE (which breaks the MSVC libcurl
          # build) and tempts mruby into the gcc toolchain. We build with MSVC.
          # (Ignored on Linux/macOS.)
          windows-toolchain: none

      # test/server.ruby (the HTTP/SMTP/IMAP fixture) needs webrick, which is no
      # longer a default gem on Ruby 3.x. rake is a default gem already.
      - name: Install test-server gem
        run: gem install webrick

      - name: Linux build deps (system libcurl via pkg-config)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config

      - name: macOS build deps (Homebrew libcurl via pkg-config)
        if: runner.os == 'macOS'
        run: |
          brew install curl pkg-config
          # curl is keg-only on macOS (the OS ships its own), so point pkg-config
          # at the Homebrew one for `spec.search_package 'libcurl'`.
          echo "PKG_CONFIG_PATH=$(brew --prefix curl)/lib/pkgconfig" >> "$GITHUB_ENV"

      # Windows: set up the MSVC (Visual Studio) developer environment — cl, the
      # SDK INCLUDE/LIB, VSINSTALLDIR — so the libcurl CMake build and the gem
      # compile with MSVC. With windows-toolchain: none above, there is no MSYS2
      # in the environment to collide with it.
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Cache the vendored libcurl build. The install prefix is all the gem
      # consumes (headers + static lib), so it lives outside mruby's build dir
      # (which `rake` recreates) and is keyed on the exact deps/curl submodule
      # commit — a curl bump busts the cache, nothing else does. mrbgem.rake
      # skips the whole CMake build when the prefix is already populated.
      - name: Windows — vendored libcurl cache key
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD:deps/curl
          echo "CURL_SUBMODULE_SHA=$sha" >> $env:GITHUB_ENV
          echo "MURL_CURL_INSTALL=$env:GITHUB_WORKSPACE\curl-prebuilt" >> $env:GITHUB_ENV
      - name: Windows — cache vendored libcurl
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: curl-prebuilt
          key: libcurl-msvc-${{ env.CURL_SUBMODULE_SHA }}-v1

      # Force the MSVC toolchain explicitly via the dedicated build config, rather
      # than relying on mruby's env auto-detection (which falls back to gcc when no
      # VS environment is detected).
      - name: Windows — use the MSVC build config
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "MRUBY_CONFIG=build_config_visualcpp.rb" >> $env:GITHUB_ENV

      - name: rake test
        run: rake test
