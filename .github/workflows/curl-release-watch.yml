name: curl release watch

# Once a week, look at the latest upstream curl release and keep exactly one
# open tracking issue for it. If a newer release appears while the previous
# tracking issue is still open (i.e. it wasn't acted on), the old one is closed
# and a fresh one is opened for the new release. An issue that was already filed
# for a given version — even one the maintainer closed — is never re-created.

on:
  schedule:
    - cron: '23 7 * * 1'   # Mondays, 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    # Don't run the scheduled job on forks.
    if: github.repository == 'asmod4n/mruby-url'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const LABEL = 'curl-update';

            // --- latest upstream curl release ---
            const rel = await github.rest.repos.getLatestRelease({ owner: 'curl', repo: 'curl' });
            const tag = rel.data.tag_name;                 // e.g. "curl-8_13_0"
            const m = /^curl-(\d+)_(\d+)_(\d+)$/.exec(tag);
            if (!m) { core.setFailed(`Unrecognized curl tag: ${tag}`); return; }
            const version = `${m[1]}.${m[2]}.${m[3]}`;
            const marker  = `<!-- curl-watch:${version} -->`;

            // --- make sure our label exists ---
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: '1d76db',
                description: 'Tracks new upstream curl releases',
              });
            }

            // --- every curl-update issue we've ever filed (open or closed) ---
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: LABEL, state: 'all', per_page: 100,
            });

            // Already filed for this version? Respect it — even if it was closed
            // (maintainer dealt with it). Never re-create the same one.
            if (issues.some(i => (i.body || '').includes(marker))) {
              core.info(`curl ${version} already has an issue; nothing to do.`);
              return;
            }

            // A newer release exists -> retire any still-open (older) tracking issues.
            for (const i of issues.filter(i => i.state === 'open')) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: i.number,
                body: `Superseded by curl ${version}; closing in favor of the newer release.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: i.number, state: 'closed', state_reason: 'not_planned',
              });
              core.info(`Closed #${i.number} (superseded by ${version}).`);
            }

            // --- file exactly one issue for the new release ---
            const body = [
              marker,
              `curl **${version}** (\`${tag}\`) was released upstream.`,
              ``,
              `- Release notes: ${rel.data.html_url}`,
              `- Changelog: https://curl.se/changes.html`,
              `- Security advisories: https://curl.se/docs/security.html`,
              ``,
              `### Suggested steps`,
              `- [ ] Review the changelog and any security fixes`,
              `- [ ] Bump the \`deps/curl\` submodule to \`${tag}\` (the vendored libcurl used for the Windows build)`,
              `- [ ] Re-run CI on Linux, macOS and Windows`,
              ``,
              `_Left unaddressed, this issue is closed and replaced automatically when the next curl release appears._`,
            ].join('\n');

            const created = await github.rest.issues.create({
              owner, repo,
              title: `curl ${version} released — review & update libcurl`,
              body, labels: [LABEL],
            });
            core.info(`Opened #${created.data.number} for curl ${version}.`);
